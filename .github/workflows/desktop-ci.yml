name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  js-desktop:
    name: Check JavaScript desktop app
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh
        working-directory: js-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: js-desktop/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies from official npm
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Verify JavaScript sources
        run: npm run check

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --registry=https://registry.npmjs.org/
