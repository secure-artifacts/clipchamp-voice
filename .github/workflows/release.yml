name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    name: Build Clipchamp Voice Studio
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh
        working-directory: js-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: js-desktop/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies from official npm
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Verify JavaScript sources
        run: npm run check

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --registry=https://registry.npmjs.org/

      - name: Build portable Windows app
        run: npm run build

      - name: Copy release asset
        run: Copy-Item -LiteralPath "dist\ClipchampVoiceStudio.exe" -Destination "$env:RUNNER_TEMP\ClipchampVoiceStudio.exe" -Force

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/ClipchampVoiceStudio.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/ClipchampVoiceStudio.exe
          generate_release_notes: true
