name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Verify Python sources
        run: python -m py_compile server.py desktop_launcher.py

      - name: Verify embedded frontend script
        shell: pwsh
        run: |
          $html = Get-Content -Raw -LiteralPath index.html
          $match = [regex]::Match($html, '<script>([\s\S]*?)</script>')
          if (-not $match.Success) { throw 'index.html script block not found' }
          $scriptPath = Join-Path $env:RUNNER_TEMP 'index-script.js'
          Set-Content -LiteralPath $scriptPath -Value $match.Groups[1].Value -Encoding UTF8
          node --check $scriptPath

      - name: Build ClipchampTTS.exe
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name ClipchampTTS
          --add-data "index.html;."
          --collect-all edge_tts
          --collect-all fastapi
          --collect-all starlette
          --collect-all pydantic
          --collect-all uvicorn
          --hidden-import uvicorn.protocols.http.h11_impl
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.lifespan.on
          desktop_launcher.py

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/ClipchampTTS.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClipchampTTS.exe
          generate_release_notes: true
